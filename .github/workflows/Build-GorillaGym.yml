name: Build Gorilla Gym APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "${{ steps.zip.outputs.ZIP }}" -d extracted

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: لم يتم العثور على مشروع Android داخل ZIP"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "DIR=$DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.DIR }}
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.DIR }}" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: لم يتم إنشاء APK"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GorillaGym-APK
          path: ${{ steps.apk.outputs.APK }}
          if-no-files-found: error
