name: Build Gorilla Gym APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | sort | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in the repository root."
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q -o "${{ steps.find_zip.outputs.zip_file }}" -d "$GITHUB_WORKSPACE/extracted"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          APK_FILE="$(find "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "APK was not generated."
            exit 1
          fi
          cp "$APK_FILE" "$GITHUB_WORKSPACE/GorillaGym.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GorillaGym-APK
          path: GorillaGym.apk
          if-no-files-found: error
