name: Build Gorilla Gym APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "The ZIP must contain a valid Android/Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/GorillaGym.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GorillaGym-APK
          path: GorillaGym.apk
          if-no-files-found: error
