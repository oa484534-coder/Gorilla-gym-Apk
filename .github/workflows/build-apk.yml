name: Build Gorilla Gym APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Check Android project
        run: |
          if [ ! -f "extracted/android-app/settings.gradle" ]; then
            echo "ERROR: Android project was not found."
            echo "Contents of extracted:"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Android project found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: extracted/android-app
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp extracted/android-app/app/build/outputs/apk/debug/app-debug.apk GorillaGym.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GorillaGym-APK
          path: GorillaGym.apk
          if-no-files-found: error
          retention-days: 30
