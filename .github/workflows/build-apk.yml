name: Build Gorilla Gym APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r -d '' file; do
            if unzip -l "$file" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
              ZIP_FILE="$file"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP was found."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Project extracted successfully."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            find "${{ steps.project.outputs.project_dir }}" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/GorillaGym.apk"

          echo "APK successfully generated:"
          ls -lh "$GITHUB_WORKSPACE/GorillaGym.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gorilla-Gym-APK
          path: GorillaGym.apk
          if-no-files-found: error
          retention-days: 7
