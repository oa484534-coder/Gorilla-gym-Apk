name: Build Gorilla Gym APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: "اسم ملف ZIP للمشروع داخل المستودع"
        required: true
        default: "GorillaGym_Project_Only.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP="${{ github.event.inputs.project_zip }}"

          if [ ! -f "$ZIP" ]; then
            echo "❌ ZIP file not found: $ZIP"
            exit 1
          fi

          mkdir -p project

          echo "📦 Extracting $ZIP ..."
          unzip -q "$ZIP" -d project

          echo "✅ ZIP extracted successfully"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find project \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ No Android Gradle project found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Android project found:"
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "🔨 Building APK..."

          ./gradlew assembleDebug

          echo "✅ APK build completed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gorilla-Gym-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
