name: Build Gorilla Gym APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            if unzip -Z1 "$file" 2>/dev/null | grep -qxE '(.*/)?settings\.gradle(\.kts)?'; then
              ZIP_FILE="$file"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP was found."
            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo "Android project ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/project"

          echo "ZIP extracted successfully."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle is missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle is missing."
            exit 1
          fi

          echo "Android project check passed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            clean \
            :app:assembleDebug \
            --stacktrace

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -e

          APK_FILE="$(
            find "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            find "${{ steps.project.outputs.project_dir }}" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/GorillaGym.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gorilla-Gym-APK
          path: GorillaGym.apk
          if-no-files-found: error
          retention-days: 7
