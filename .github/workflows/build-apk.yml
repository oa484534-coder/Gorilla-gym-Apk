name: Build Gorilla Gym APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: "اسم ملف ZIP للمشروع داخل المستودع"
        required: true
        default: "GorillaGym_Project_Only.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ github.event.inputs.project_zip }}"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found: $ZIP"
            exit 1
          fi

          rm -rf project
          mkdir -p project
          unzip -q "$ZIP" -d project

          echo "Project extracted successfully."

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "No Android Gradle project found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gorilla-Gym-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
